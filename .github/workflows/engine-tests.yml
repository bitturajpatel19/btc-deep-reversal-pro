name: Paper Engine Tests
on:
  push:
    paths:
      - "engine-server/**"
      - ".github/workflows/engine-tests.yml"
  pull_request:
    paths:
      - "engine-server/**"
      - ".github/workflows/engine-tests.yml"
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
